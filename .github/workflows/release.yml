name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Test and release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(bun -e 'console.log(require("./packages/cli/package.json").version)')"
          if [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match CLI version v$package_version."
            exit 1
          fi

      - name: Check types
        run: bun run check-types

      - name: Run tests
        run: bun test

      - name: Test packaged CLI
        run: bun run test:package

      - name: Create release archive
        run: |
          mkdir release
          cd packages/cli
          bun pm pack \
            --filename ../../release/regalator-cli.tgz
          cd ../../release
          sha256sum regalator-cli.tgz > regalator-cli.tgz.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/regalator-cli.tgz \
            release/regalator-cli.tgz.sha256 \
            --generate-notes \
            --title "Regalator $RELEASE_TAG" \
            --verify-tag
