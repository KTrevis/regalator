services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./examples/embed-host:/srv/embed-host:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
